[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = ..
# pytest-timeout (comes with the Home Assistant test harness): a hanging test fails
# after this many seconds instead of blocking CI for hours. "thread" dumps every
# thread, the event loop's included, and ends the run, so a hang shows where it is.
timeout = 120
timeout_method = thread
