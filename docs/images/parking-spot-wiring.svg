<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" width="820" height="410" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Parking spot sensor wiring: ESP32-C3 Super Mini and HC-SR04</title>
  <rect width="820" height="410" fill="#ffffff"/>

  <!-- ESP32-C3 Super Mini (USB-C at the top, as seen from the component side) -->
  <rect x="60" y="70" width="190" height="270" rx="10" fill="#1f2328"/>
  <rect x="125" y="52" width="60" height="30" rx="6" fill="#9aa1a8"/>
  <text x="155" y="105" fill="#ffffff" text-anchor="middle" font-weight="bold">ESP32-C3</text>
  <text x="155" y="122" fill="#ffffff" text-anchor="middle" font-weight="bold">Super Mini</text>
  <text x="155" y="140" fill="#c9d1d9" text-anchor="middle" font-size="11">powered over USB-C</text>

  <!-- right-hand pins, top to bottom -->
  <g fill="#c9d1d9" font-size="12" text-anchor="end">
    <text x="236" y="175">5V</text>
    <text x="236" y="198">GND</text>
    <text x="236" y="221">3V3</text>
    <text x="236" y="244">GPIO4</text>
    <text x="236" y="267" fill="#3fb950" font-weight="bold">GPIO3</text>
    <text x="236" y="290" fill="#f85149">GPIO2</text>
    <text x="236" y="313">GPIO1</text>
  </g>
  <g fill="#d4a72c">
    <circle cx="250" cy="171" r="5"/><circle cx="250" cy="194" r="5"/><circle cx="250" cy="217" r="5"/>
    <circle cx="250" cy="240" r="5"/><circle cx="250" cy="263" r="5"/><circle cx="250" cy="286" r="5"/>
    <circle cx="250" cy="309" r="5"/>
  </g>
  <!-- left-hand pin used -->
  <text x="74" y="175" fill="#c9d1d9" font-size="12">GPIO5</text>
  <circle cx="60" cy="171" r="5" fill="#d4a72c"/>

  <!-- HC-SR04 -->
  <rect x="640" y="110" width="150" height="190" rx="8" fill="#1f5fa8"/>
  <circle cx="715" cy="160" r="30" fill="#c0c6cc" stroke="#6e7781" stroke-width="3"/>
  <circle cx="715" cy="250" r="30" fill="#c0c6cc" stroke="#6e7781" stroke-width="3"/>
  <text x="715" y="98" text-anchor="middle" font-weight="bold" fill="#1f2328">HC-SR04</text>
  <g fill="#ffffff" font-size="12">
    <text x="652" y="175">Vcc</text><text x="652" y="198">Trig</text>
    <text x="652" y="221">Echo</text><text x="652" y="244">Gnd</text>
  </g>
  <g fill="#d4a72c">
    <circle cx="640" cy="171" r="5"/><circle cx="640" cy="194" r="5"/>
    <circle cx="640" cy="217" r="5"/><circle cx="640" cy="240" r="5"/>
  </g>

  <!-- 5V -> Vcc -->
  <polyline points="255,171 640,171" fill="none" stroke="#d1242f" stroke-width="3"/>
  <!-- GND -> Gnd -->
  <polyline points="255,194 330,194 330,355 600,355 600,240 640,240" fill="none" stroke="#1f2328" stroke-width="3"/>
  <!-- GPIO5 -> Trig, around the board -->
  <polyline points="55,171 30,171 30,25 560,25 560,194 640,194" fill="none" stroke="#8250df" stroke-width="3"/>
  <!-- Echo -> 10k -> node -> GPIO3 -->
  <polyline points="640,217 540,217 540,263 515,263" fill="none" stroke="#1a7f37" stroke-width="3"/>
  <rect x="445" y="252" width="70" height="22" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="480" y="268" text-anchor="middle" font-weight="bold">10 kΩ</text>
  <polyline points="445,263 255,263" fill="none" stroke="#1a7f37" stroke-width="3"/>
  <circle cx="400" cy="263" r="4.5" fill="#1a7f37"/>
  <!-- node -> 20k -> GND -->
  <polyline points="400,263 400,285" fill="none" stroke="#1a7f37" stroke-width="3"/>
  <rect x="389" y="285" width="22" height="50" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="420" y="315" font-weight="bold">20 kΩ</text>
  <polyline points="400,335 400,355" fill="none" stroke="#1f2328" stroke-width="3"/>
  <circle cx="400" cy="355" r="4.5" fill="#1f2328"/>

  <!-- notes -->
  <text x="60" y="378" fill="#1f2328" font-size="12">Echo is 5 V: the 10k/20k divider brings it to about 3.3 V for the ESP32.</text>
  <text x="60" y="395" fill="#cf222e" font-size="12">Echo on GPIO3, not GPIO2 as in the box's original diagram: GPIO2 is a strapping pin, and the divider's pull-down can upset boot.</text>
</svg>
