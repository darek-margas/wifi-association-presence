name: New access point model
description: Help add support for an access point that isn't supported yet.
title: "Support for <vendor> <model>"
labels: ["new access point"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! The most useful thing is a report from `scripts/collect.py`:
        it logs into your access point, runs read-only commands only, and redacts MAC
        and IP addresses and secret-looking settings.

        ```bash
        pip install asyncssh
        python3 scripts/collect.py --host <AP IP> --username <user>
        ```
        If the connection fails with an algorithm error, add `--legacy-ssh`.
        Add `--command "<cmd>"` (repeatable) for any command you know lists connected
        clients. UniFi APs: `--profile unifi`.

        **SNMP instead of SSH:** `pip install pysnmp`, then
        `python3 scripts/collect.py --host <AP IP> --snmp` (v2c, use a read-only community)
        or add `--snmp-user <user>` for v3. It finds your vendor's private MIB and lists
        the tables that look like client tables.

        > ⚠️ **Read the whole report before attaching it, and redact by hand what is still
        > private.** Automatic redaction removes MAC/IP/email addresses, key-like strings
        > and the credentials you typed, but it can't recognise everything: a Wi-Fi
        > passphrase, names, locations or serial numbers can look like ordinary text.
        > Replace them with `<redacted>`. This issue will be public.
        For what a good report looks like, see
        [`docs/ap-reports/dlink-dap-2610-v2.06.txt`](../blob/main/docs/ap-reports/dlink-dap-2610-v2.06.txt).
  - type: input
    id: model
    attributes:
      label: Vendor and model
      placeholder: e.g. D-Link DAP-2660, TP-Link EAP245
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
    validations:
      required: true
  - type: checkboxes
    id: access
    attributes:
      label: Management access the AP offers
      options:
        - label: SSH console
        - label: Telnet console
        - label: Web UI that lists connected clients
        - label: SNMP
        - label: Other (describe below)
  - type: textarea
    id: clients_command
    attributes:
      label: How do you see connected clients today?
      description: The CLI command, web page or app screen that lists associated clients per band/SSID.
  - type: textarea
    id: report
    attributes:
      label: collect.py report
      description: Paste the report, or drag the file here. Read it first and redact by hand anything still private.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: reviewed
    attributes:
      label: Privacy
      options:
        - label: I have read the whole report and replaced anything private (passphrases, names, locations, serial numbers) with `<redacted>`.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Quirks you noticed, e.g. clients per band need a command first, login methods, timeouts.
