name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install pytest ruff "asyncssh>=2.14.2"
      - name: Lint (errors only)
        run: ruff check --select E9,F custom_components scripts tests
      - name: Run tests
        run: python -m pytest -v tests
