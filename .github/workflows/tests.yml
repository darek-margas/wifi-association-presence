name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install pytest ruff "asyncssh>=2.14.2"
      - name: Lint (errors only)
        run: ruff check --select E9,F custom_components scripts tests
      - name: Run tests
        run: python -m pytest -v tests

  tests-ha:
    # The integration set up in a test Home Assistant (pytest-homeassistant-custom-component),
    # on the Python version current Home Assistant needs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Home Assistant test harness
        run: pip install pytest-homeassistant-custom-component "asyncssh>=2.14.2"
      - name: Install aiounifi as pinned by that Home Assistant's UniFi integration
        # The UniFi driver uses it at runtime, where it comes with the UniFi integration.
        run: |
          pip install "$(python -c 'import json, pathlib, homeassistant.components.unifi as u; print(json.loads((pathlib.Path(u.__file__).parent / "manifest.json").read_text())["requirements"][0])')"
      - name: Run Home Assistant-level tests
        run: python -m pytest -v tests_ha
