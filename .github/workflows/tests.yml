name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  # The release workflow runs these same tests (both jobs) before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies (waits for a just-released library on PyPI)
        run: bash .github/scripts/install-requirements.sh pytest ruff
      - name: Lint (errors only)
        run: ruff check --select E9,F custom_components scripts tests
      - name: Run tests
        run: python -m pytest -v tests

  tests-ha:
    # The integration set up in a test Home Assistant (pytest-homeassistant-custom-component),
    # on the Python version current Home Assistant needs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Home Assistant test harness
        run: bash .github/scripts/install-requirements.sh pytest-homeassistant-custom-component
      - name: Install aiounifi as pinned by that Home Assistant's UniFi integration
        # The UniFi driver uses it at runtime, where it comes with the UniFi integration.
        # Read the pin from the manifest file: importing the UniFi integration itself
        # would need aiounifi already.
        run: |
          set -euo pipefail
          REQ="$(python -c 'import importlib.util, json, pathlib; p = pathlib.Path(importlib.util.find_spec("homeassistant").origin).parent / "components" / "unifi" / "manifest.json"; print(json.loads(p.read_text())["requirements"][0])')"
          echo "UniFi integration requires: $REQ"
          pip install "$REQ"
      - name: Run Home Assistant-level tests
        run: python -m pytest -v tests_ha
